name: axentra-local

services:
  postgres:
    image: postgres:16.6-alpine
    container_name: axentra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: axentra
      POSTGRES_USER: axentra
      POSTGRES_PASSWORD: local-postgres-password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - axentra_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axentra -d axentra"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4.1-alpine
    container_name: axentra-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - axentra_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: ghcr.io/coollabsio/minio:latest
    container_name: axentra-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: local-minio-user
      MINIO_ROOT_PASSWORD: local-minio-password
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - axentra_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  axentra_postgres_data:
    name: axentra-postgres-data
  axentra_redis_data:
    name: axentra-redis-data
  axentra_minio_data:
    name: axentra-minio-data
