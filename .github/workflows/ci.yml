name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.12

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Bun install store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Dependency security audit
        run: bun audit --audit-level=moderate
      - run: bun run fmt
      - run: bun run lint
      - run: bun run type-check

  unit-and-build:
    name: Unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Bun install store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build

  integration:
    name: Infrastructure integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_DB: axentra
          POSTGRES_USER: axentra
          POSTGRES_PASSWORD: local-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axentra -d axentra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      APP_ENV: test
      APP_VERSION: 0.1.0
      LOG_LEVEL: warn
      API_PORT: 3001
      DATABASE_URL: postgres://axentra:local-postgres-password@localhost:5432/axentra
      REDIS_URL: redis://localhost:6379/0
      S3_PROVIDER: minio
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: ap-southeast-3
      S3_BUCKET: axentra-ci
      S3_ACCESS_KEY_ID: local-minio-user
      S3_SECRET_ACCESS_KEY: local-minio-password
      S3_FORCE_PATH_STYLE: true
      AUTH_LOCAL_IDENTITY_DIRECTORY: 

    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Bun install store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Start MinIO
        run: >-
          docker run --detach --name axentra-minio
          --publish 9000:9000
          --env MINIO_ROOT_USER=local-minio-user
          --env MINIO_ROOT_PASSWORD=local-minio-password
          quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
          server /data
      - name: Wait for MinIO
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:9000/minio/health/live; then
              exit 0
            fi
            sleep 2
          done
          docker logs axentra-minio
          exit 1
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
      - run: bun run test:integration
